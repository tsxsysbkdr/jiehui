<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#e6ddc9">
<title>劫灰</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:radial-gradient(120% 80% at 50% -10%,#faf6ec 0%,#efe7d5 45%,#e2d8c2 100%);
  color:#2b2620;display:flex;flex-direction:column;height:100dvh;overflow:hidden;
  user-select:none;-webkit-user-select:none;
}

/* ── 顶栏 ───────────────────────────── */
#top{padding:10px 14px 4px;flex:none}
#title{display:flex;align-items:baseline;gap:8px}
#title b{font-size:19px;letter-spacing:5px;font-weight:600}
#title span{font-size:11px;color:#8a7f6b;letter-spacing:1px}
#meta{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:12px;color:#6b6252}
#ashbar{display:flex;gap:3px;align-items:center;flex-wrap:wrap}
#ashbar i{width:9px;height:9px;border-radius:2px;background:#cfc6b2;display:block;transition:background .3s}
#ashbar i.on{background:#8f3d34}

/* ── 双方信息 ────────────────────────── */
#sides{display:flex;gap:8px;padding:8px 14px 6px;flex:none}
.side{flex:1;background:rgba(255,255,255,.42);border:1px solid rgba(120,105,80,.16);
  border-radius:10px;padding:6px 9px;display:flex;align-items:center;gap:7px;font-size:12px}
.side.me{background:rgba(120,150,120,.13);border-color:rgba(90,120,90,.3)}
.side .dot{width:15px;height:15px;border-radius:50%;flex:none}
.dot.b{background:radial-gradient(circle at 36% 30%,#6d6a66,#191817 62%,#060606 100%);
  box-shadow:inset 0 1px 2px rgba(255,255,255,.25),0 1px 2px rgba(0,0,0,.35)}
.dot.w{background:radial-gradient(circle at 36% 30%,#fffefb,#f0eadc 55%,#cdc4af 100%);
  box-shadow:inset 0 0 0 1px rgba(110,98,76,.35),0 1px 2px rgba(0,0,0,.16)}
.side .nm{color:#5a5245;flex:none}
.side .sc{font-size:11px;color:#4a5a4a;font-variant-numeric:tabular-nums;
  background:rgba(90,120,90,.12);border-radius:6px;padding:1px 5px;white-space:nowrap;flex:none}
.side .sc b{font-size:13px;font-weight:700}
.side .cn{font-variant-numeric:tabular-nums;font-weight:600;color:#7a6a45;flex:none}
.side .cn small{font-weight:400;opacity:.65}

/* 气：像血量条，能往上涨（上限跟弈士走） */
.qibar{flex:1;min-width:34px;display:flex;gap:2px;height:11px;align-items:stretch}
.qibar i{flex:1;border-radius:2px;background:rgba(120,105,80,.17);transition:background .25s,box-shadow .25s}
.qibar i.on{background:linear-gradient(180deg,#9fb8a6,#6f8f7c);box-shadow:0 0 0 1px rgba(80,110,90,.25) inset}
.qibar i.fresh{background:linear-gradient(180deg,#c9dcb6,#8cb073)}
/* 道具栏 */
.side .it{flex:none;font-size:11px;color:#6b6252;background:rgba(140,120,80,.12);
  border-radius:6px;padding:1px 5px;white-space:nowrap;cursor:pointer;display:none}
.side .it.has{display:block}

/* ── 棋盘：棋子落在交叉点上 ───────────── */
#wrap{flex:1;display:grid;place-items:center;min-height:0;padding:2px 12px}
#board{
  position:relative;
  width:min(92vw,352px,50dvh);aspect-ratio:1;
  background-color:#e8ddc3;
  background-image:
    repeating-linear-gradient(92.5deg,rgba(152,126,86,.05) 0 1px,rgba(255,255,255,0) 1px 6px),
    repeating-linear-gradient(3.5deg,rgba(122,98,62,.038) 0 1px,rgba(255,255,255,0) 1px 13px),
    radial-gradient(130% 95% at 28% 6%,rgba(255,255,255,.52) 0%,rgba(255,255,255,0) 58%),
    radial-gradient(85% 70% at 82% 96%,rgba(108,86,54,.17) 0%,rgba(255,255,255,0) 72%),
    linear-gradient(160deg,rgba(255,255,255,.3),rgba(160,140,105,.12));
  border-radius:3px;
  box-shadow:
    inset 0 0 26px rgba(96,72,42,.2),
    inset 0 1px 0 rgba(255,255,255,.85),
    inset 0 -1px 0 rgba(96,72,42,.22),
    0 0 0 1px rgba(122,101,68,.5),
    0 0 0 6px #efe6d1,
    0 0 0 7px rgba(122,101,68,.42),
    0 10px 28px rgba(78,60,36,.22);
}
#board svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#board svg line{stroke:rgba(104,84,54,.62);stroke-width:.022;stroke-linecap:square}
#board svg line.edge{stroke:rgba(104,84,54,.8);stroke-width:.03}

#grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(9,1fr)}
.cell{position:relative;cursor:default}
.cell.tap{cursor:pointer}
.cell.tap:active{background:radial-gradient(circle,rgba(104,86,56,.2) 0 33%,transparent 34%)}

/* 棋子：黑子 / 白子，圆点在交叉点正中 */
.cell.b::after,.cell.w::after{content:'';position:absolute;inset:9%;border-radius:50%;z-index:2}
.cell.b::after{
  background:radial-gradient(circle at 34% 26%,#7c7872 0%,#3a3835 26%,#161514 62%,#050505 100%);
  box-shadow:inset 0 -1px 3px rgba(0,0,0,.6),inset 0 1px 2px rgba(255,255,255,.22),0 2px 5px rgba(0,0,0,.4);
}
.cell.w::after{
  background:radial-gradient(circle at 34% 26%,#fffefc 0%,#f4efe2 38%,#ded5c0 78%,#c2b8a1 100%);
  box-shadow:inset 0 0 0 1px rgba(120,106,82,.32),inset 0 -1px 3px rgba(120,106,82,.28),0 2px 5px rgba(0,0,0,.22);
}

/* 劫灰：暗红墨渍（和黑子分得开） */
.cell.a::before{
  content:'';position:absolute;inset:2%;border-radius:46% 54% 44% 56%/56% 44% 58% 42%;
  background:radial-gradient(circle at 42% 38%,
    rgba(126,42,36,.72) 0%,rgba(126,42,36,.5) 38%,rgba(126,42,36,.16) 64%,rgba(126,42,36,0) 76%);
  filter:blur(.7px);
}
.cell.a::after{
  content:'';position:absolute;inset:8%;border-radius:50%;
  background:
    radial-gradient(circle at 26% 68%,rgba(126,42,36,.62) 0 11%,transparent 12%),
    radial-gradient(circle at 72% 26%,rgba(126,42,36,.5) 0 8%,transparent 9%),
    radial-gradient(circle at 82% 76%,rgba(126,42,36,.4) 0 6%,transparent 7%),
    radial-gradient(circle at 16% 24%,rgba(126,42,36,.34) 0 5%,transparent 6%);
  filter:blur(.8px);
}

.cell.anchor::after{content:'';position:absolute;inset:39%;border-radius:50%;
  background:rgba(64,110,160,.6);pointer-events:none;z-index:3}
/* 本明轮先手刚落的子：一圈暖光，防止「看不见自己那颗」 */
.cell.last::before{content:'';position:absolute;inset:1%;border-radius:50%;
  box-shadow:0 0 0 1.5px rgba(176,132,52,.85),0 0 10px rgba(176,132,52,.6);
  pointer-events:none;z-index:1;animation:lastpulse 1.8s ease-in-out infinite}
@keyframes lastpulse{
  0%,100%{opacity:.55}
  50%{opacity:1}
}
/* 可杀的敌子：红圈套在棋子外面，子本身照旧显示 */
.cell.kill::before{content:'';position:absolute;inset:-3%;border:2px solid rgba(163,32,24,.95);
  border-radius:50%;pointer-events:none;z-index:1;animation:pl 1.5s infinite}
@keyframes pl{
  0%,100%{box-shadow:0 0 3px rgba(163,32,24,.35)}
  50%{box-shadow:0 0 11px rgba(163,32,24,.85)}
}
.cell.sel::before{content:'';position:absolute;inset:16%;border:2px dashed rgba(64,110,160,.9);border-radius:50%;z-index:3}
/* 有盾的子：一圈冷银色（双方都看得见 —— 看得见才不是陷阱） */
.cell.sh::after{content:'';position:absolute;inset:4%;border-radius:50%;
  border:2px solid rgba(146,168,186,.95);
  box-shadow:0 0 0 1px rgba(255,255,255,.55) inset,0 0 9px rgba(126,158,186,.75);
  pointer-events:none;z-index:3}

/* ── 成灰特效：杀（红，主动）／劫（蓝灰，无妄之灾）──────── */
#fx{position:absolute;inset:0;pointer-events:none;z-index:20}
.fx{position:absolute;width:11.12%;height:11.12%;pointer-events:none;
  transform:translate(-50%,-50%);display:grid;place-items:center}
.fx .ink{position:absolute;inset:-55%;border-radius:47% 53% 45% 55%/55% 45% 53% 47%;
  filter:blur(.5px);animation:fxink .9s cubic-bezier(.2,.7,.3,1) forwards}

/* 杀：暗红，从中心炸开 */
.fx.kill .ink{
  background:radial-gradient(circle at 46% 44%,rgba(163,26,20,.9) 0%,rgba(126,42,36,.62) 36%,rgba(96,26,22,.22) 58%,rgba(126,42,36,0) 74%);
}
.fx.kill .word{color:#7e1a14;
  text-shadow:0 0 5px rgba(255,246,232,.95),0 0 12px rgba(255,246,232,.7)}

/* 劫：蓝灰，像被水浸透的一块，慢慢洇开，没有冲击力 */
.fx.jie .ink{
  background:radial-gradient(circle at 50% 46%,rgba(78,96,112,.78) 0%,rgba(96,110,124,.5) 34%,rgba(112,124,136,.2) 56%,rgba(112,124,136,0) 74%);
  animation:fxdamp 1.15s ease-out forwards}
@keyframes fxdamp{
  0%{transform:scale(.3);opacity:.55}
  40%{transform:scale(1.3);opacity:.8}
  100%{transform:scale(2.4);opacity:0}
}
.fx.jie .word{color:#42525f;
  text-shadow:0 0 5px rgba(250,248,242,.95),0 0 13px rgba(250,248,242,.75);
  animation:fxword 1.2s ease-out forwards}

@keyframes fxink{
  0%{transform:scale(.12);opacity:1}
  45%{transform:scale(1.55);opacity:.82}
  100%{transform:scale(3.1);opacity:0}
}
.fx .word{position:absolute;inset:0;display:grid;place-items:center;
  font-size:12px;letter-spacing:1.5px;font-weight:700;
  white-space:nowrap;animation:fxword 1.05s ease-out forwards}
@keyframes fxword{
  0%{transform:scale(.5);opacity:0}
  22%{transform:scale(1.4);opacity:1}
  60%{transform:scale(1.15);opacity:.95}
  100%{transform:scale(1.3) translateY(-15px);opacity:0}
}
/* 杀才震；劫不震 —— 一个是动手，一个是天灾 */
#board.hit{animation:hit .34s cubic-bezier(.36,.07,.19,.97)}
@keyframes hit{
  0%,100%{transform:translate(0,0)}
  18%{transform:translate(-2.5px,1.5px)}
  42%{transform:translate(2.5px,-1.5px)}
  68%{transform:translate(-1.5px,-1px)}
  85%{transform:translate(1px,1px)}
}

/* ── 操作区 ─────────────────────────── */
#bar{flex:none;padding:6px 14px calc(12px + env(safe-area-inset-bottom));min-height:120px}
#msg{font-size:13px;color:#5f5647;text-align:center;line-height:1.5;min-height:20px;margin-bottom:8px}
#msg em{font-style:normal;color:#9a6b3a;font-weight:600}
#msg s{color:#8a8070;text-decoration:none}
#btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
button{
  font:inherit;font-size:14px;border:0;border-radius:11px;padding:11px 16px;
  background:#3f3a32;color:#f7f2e6;cursor:pointer;transition:transform .08s,opacity .2s;
  min-width:56px;
}
button:active{transform:scale(.96)}
button:disabled{opacity:.38;cursor:default}
button.ghost{background:rgba(255,255,255,.6);color:#3f3a32;box-shadow:inset 0 0 0 1px rgba(120,105,80,.35)}
button.accentbtn{background:#8c3b30}
button.shopbtn{background:rgba(255,255,255,.5);color:#5a5040;box-shadow:inset 0 0 0 1px rgba(120,105,80,.35);
  font-size:13px;padding:10px 13px;min-width:0}
button.wide{padding:11px 24px}
button.small{font-size:13px;padding:9px 12px;min-width:46px;border-radius:9px}
#log{font-size:11px;color:#8a8070;text-align:center;margin-top:6px;height:15px;overflow:hidden}
#room{font-size:11px;color:#8a7f6b;text-align:center;margin-top:4px}
#room code{background:rgba(255,255,255,.6);padding:1px 5px;border-radius:4px;letter-spacing:1.5px;color:#5a5245}

/* ── 商店浮层 ───────────────────────── */
#shop{position:fixed;inset:0;background:rgba(40,34,26,.42);display:none;place-items:center;z-index:50;padding:20px}
#shop.on{display:grid}
#sheet{background:#f7f2e6;border-radius:14px;padding:16px 16px 14px;width:min(94vw,330px);
  box-shadow:0 18px 44px rgba(40,30,18,.34);max-height:80dvh;overflow:auto}
#sheet h3{margin:0 0 4px;font-size:15px;letter-spacing:1px}
#sheet .sub{font-size:11px;color:#8a8070;margin-bottom:12px}
.item{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid rgba(120,105,80,.16)}
.item .nm{font-size:13px;font-weight:600}
.item .ds{font-size:11px;color:#8a8070;line-height:1.45;margin-top:2px}
.item .lf{flex:1;min-width:0}
.item .ct{font-size:11px;color:#8a7f6b;white-space:nowrap;text-align:right}
.item button{font-size:12px;padding:8px 12px;min-width:0;border-radius:9px}
#sheet .close{display:block;width:100%;margin-top:12px;background:rgba(255,255,255,.6);color:#3f3a32;
  box-shadow:inset 0 0 0 1px rgba(120,105,80,.35)}
</style>
</head>
<body>

<div id="top">
  <div id="title"><b>劫灰</b><span id="roundTxt"></span></div>
  <div id="meta">
    <span>劫灰</span>
    <div id="ashbar"></div>
    <span id="ashTxt"></span>
  </div>
</div>

<div id="sides">
  <div class="side" id="sideMe"><div class="dot"></div><div class="nm">你</div><div class="qibar"></div><div class="sc"></div><div class="cn">0<small>币</small></div><div class="it"></div></div>
  <div class="side" id="sideOpp"><div class="dot"></div><div class="nm">敌</div><div class="qibar"></div><div class="sc"></div><div class="cn">0<small>币</small></div><div class="it"></div></div>
</div>

<div id="wrap"><div id="board">
  <svg viewBox="0 0 9 9" preserveAspectRatio="none" id="lines"></svg>
  <div id="grid"></div>
  <div id="fx"></div>
</div></div>

<div id="bar">
  <div id="msg"></div>
  <div id="btns"></div>
  <div id="log"></div>
  <div id="room"></div>
</div>

<div id="shop"><div id="sheet">
  <h3>商店</h3>
  <div class="sub">随时可买，买到的道具在手里囤着。</div>
  <div id="shopList"></div>
  <button class="close" id="shopClose">关上</button>
</div></div>

<script>
(function () {
  'use strict';
  var EMPTY = 0, BLACK = 1, WHITE = 2, ASH = 3;
  var N = 9;

  var S = { room: null, token: null, seat: -1, view: null, sel: null, busy: false, note: '', shop: false, shieldPick: false, fxSeen: -1 };

  function $(s) { return document.querySelector(s); }
  function nameOf(list, id) { for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i].name; return id; }

  function token() {
    var t = sessionStorage.getItem('jh_tk');
    if (!t) { t = 'k' + Math.random().toString(36).slice(2) + Date.now().toString(36); sessionStorage.setItem('jh_tk', t); }
    return t;
  }
  S.token = token();

  function post(url, body) {
    return fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function (r) {
      // 容器休眠/重启时 SnapDeploy 会返回一张 HTML 唤醒页，不是 JSON。
      // 直接 r.json() 会炸出「Unexpected token '<'」，所以先看类型。
      var ct = r.headers.get('content-type') || '';
      if (ct.indexOf('json') < 0) {
        throw new Error('服务器正在唤醒，等十几秒再点一次');
      }
      return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status)); return j; });
    });
  }

  function join(room, isRetry) {
    return post('/api/join', { token: S.token, room: room }).then(function (j) {
      S.room = j.room; S.seat = j.seat; S.view = j.view;
      sessionStorage.setItem('jh_room', j.room);
      try { history.replaceState(null, '', '#' + j.room); } catch (e) { }
      render();
      poll();
    }).catch(function (e) {
      if (!isRetry && !room) return join('', true);
      if (!isRetry && /房间不存在/.test(e.message)) {
        try { history.replaceState(null, '', location.pathname); } catch (x) { }
        return join('', true);
      }
      $('#msg').innerHTML = '进不去：' + e.message + '<br><br>可能是这局已经过期了。';
      $('#btns').innerHTML = '';
      var b = document.createElement('button'); b.textContent = '新开一桌';
      b.onclick = function () { join(''); };
      $('#btns').appendChild(b);
    });
  }

  var polling = false;
  function poll() {
    if (polling) return;
    polling = true;
    var q = '/api/state?room=' + S.room + '&token=' + encodeURIComponent(S.token) + '&v=' + (S.view ? S.view.v : 0);
    fetch(q).then(function (r) {
      return r.json().then(function (j) {
        polling = false;
        if (!r.ok) { setTimeout(poll, 1200); return; }
        S.view = j; render(); poll();
      });
    }).catch(function () { polling = false; setTimeout(poll, 1200); });
  }

  function act(action) {
    if (S.busy) return;
    S.busy = true;
    var keep = S.view;
    post('/api/act', { room: S.room, token: S.token, action: action }).then(function (j) {
      S.view = j.view; S.busy = false; S.note = ''; S.sel = null; render();
    }).catch(function (e) {
      S.busy = false; S.view = keep; S.note = e.message; render();
    });
  }

  // ── 棋盘：9 条竖线 9 条横线，交叉点就是落点 ────────────
  (function drawLines() {
    var svg = $('#lines'), NS = 'http://www.w3.org/2000/svg';
    var lo = 0.5, hi = N - 0.5;
    for (var i = 0; i < N; i++) {
      var c = i + 0.5;
      var v = document.createElementNS(NS, 'line');
      v.setAttribute('x1', c); v.setAttribute('y1', lo);
      v.setAttribute('x2', c); v.setAttribute('y2', hi);
      if (i === 0 || i === N - 1) v.setAttribute('class', 'edge');
      svg.appendChild(v);
      var h = document.createElementNS(NS, 'line');
      h.setAttribute('x1', lo); h.setAttribute('y1', c);
      h.setAttribute('x2', hi); h.setAttribute('y2', c);
      if (i === 0 || i === N - 1) h.setAttribute('class', 'edge');
      svg.appendChild(h);
    }
  })();

  var gridEl = $('#grid'), cells = [];
  for (var i = 0; i < N * N; i++) {
    var d = document.createElement('div');
    d.className = 'cell'; d.dataset.i = i;
    d.addEventListener('click', onCell);
    gridEl.appendChild(d); cells.push(d);
  }

  function onCell() {
    var v = S.view; if (!v || v.over || !v.both) return;
    var i = +this.dataset.i;
    // 盾位：点自己的一颗老子，罩上盾
    if (S.shieldPick) {
      if (v.need !== 'hidden') { S.shieldPick = false; S.note = '盾只能在自己暗轮落子前用'; render(); return; }
      if (v.cells[i] !== S.view.seat + 1) { S.note = '盾只能罩自己的子'; render(); return; }
      S.shieldPick = false;
      act({ type: 'use', id: 'shield', cell: i });
      return;
    }
    if (v.need === 'place' || v.need === 'second') {
      var isKill = (v.killTargets || []).indexOf(i) >= 0;
      if (isKill) { act({ type: 'place', cell: i }); return; }
      if (v.cells[i] !== EMPTY) return;
      if (v.need === 'second') {
        var an = v.anchors || [];
        if (an.length > 0 && an.indexOf(i) < 0) {
          S.note = '这一手得贴着落；也可以去盖掉对方无保护的子';
          render(); return;
        }
      }
      act({ type: 'place', cell: i });
    } else if (v.need === 'hidden') {
      if (v.cells[i] !== EMPTY) return;
      S.sel = i; render();
    }
  }

  function render() {
    var v = S.view; if (!v) return;
    var me = v.seat, op = 1 - v.seat;
    processFx(v);

    // ── 选人界面（只有一个无锋，但流程留着）
    if (v.picking) {
      for (var q = 0; q < N * N; q++) cells[q].className = 'cell';
      var m = v.myPick ? '你选了 <em>' + nameOf(v.champs, v.myPick) + '</em>。' : '选一个弈士，双方选完即开局。';
      if (!v.both) m = '把地址发给朋友等他进桌 —— 或者再开一个浏览器标签页自己试。<br>两人到齐后选弈士开局。';
      if (v.myPick && !v.oppPicked) m += '<br>等对手选…';
      $('#msg').innerHTML = m;
      $('#roundTxt').textContent = '';

      var bx = $('#btns'); bx.innerHTML = '';
      if (v.both && !v.myPick) {
        v.champs.forEach(function (c) {
          var el = document.createElement('button');
          el.textContent = c.name + ' · ' + c.tag;
          el.className = 'ghost';
          el.onclick = function () { act({ type: 'champ', id: c.id }); };
          bx.appendChild(el);
        });
      }
      var desc = document.createElement('div');
      desc.style.cssText = 'font-size:11px;color:#8a8070;text-align:center;line-height:1.7;margin-top:8px';
      if (v.both && !v.myPick) {
        desc.innerHTML = v.champs.map(function (c) {
          return '<b>' + c.name + '</b>　' + c.desc + '（起手 ' + c.coins + ' 币）';
        }).join('<br>');
      }
      var cpBtn = document.createElement('button');
      cpBtn.className = 'ghost'; cpBtn.textContent = '复制邀请链接';
      cpBtn.onclick = copyLink;
      bx.appendChild(cpBtn);
      $('#log').innerHTML = '';
      $('#log').style.height = 'auto';
      $('#log').appendChild(desc);
      $('#room').innerHTML = '房号 <code>' + v.room + '</code>';
      S.shop = false; renderShop();
      return;
    }
    $('#log').style.height = '15px';

    // ── 顶栏
    var modeTxt = (v.phase === 'auction' || v.phase === 'tie-raise' || v.phase === 'raise' || v.phase === 'order')
      ? '竞拍' : v.roundMode === 'open' ? '明轮' : v.roundMode === 'hidden' ? '暗轮' : '';
    $('#roundTxt').textContent = v.round + '/' + v.totalRounds + ' 轮 · ' + modeTxt;
    var ab = $('#ashbar'); ab.innerHTML = '';
    // 劫灰格子数跟着「这局最多可能有多少灰」走，不是死写 14：
    // 9×9 最多 81 格，但一局实际就十来格，留一点余量按 10 的倍数加。
    var pips = Math.max(12, Math.ceil((v.ashCount + 2) / 10) * 10);
    for (var k = 0; k < pips; k++) {
      var e = document.createElement('i');
      if (k < v.ashCount) e.className = 'on';
      ab.appendChild(e);
    }
    $('#ashTxt').textContent = v.ashCount;

    // ── 双方：气（血量条）+ 实时计分（当前最大连通块）+ 持币 + 道具栏
    var scores = v.scores || [0, 0];
    function paintSide(pre, who) {
      var cap = (v.qiCap && v.qiCap[who]) || 5;
      var q = v.qi ? (v.qi[who] || 0) : 0;
      var qb = $(pre + ' .qibar');
      if (qb.children.length > cap) qb.innerHTML = '';
      while (qb.children.length < cap) qb.appendChild(document.createElement('i'));
      for (var i3 = 0; i3 < cap; i3++) {
        qb.children[i3].className = i3 < q ? 'on' : '';
      }
      $(pre + ' .sc').innerHTML = '地 <b>' + (scores[who] || 0) + '</b>';
      $(pre + ' .cn').innerHTML = (v.coins[who] || 0) + '<small>币</small>';
      var own = (v.items[who] || []).length;
      var sh = (v.shields && v.shields[who]) ? v.shields[who].length : 0;
      var itEl = $(pre + ' .it');
      if (own) {
        itEl.className = 'it has';
        itEl.textContent = '盾' + own + (sh ? '/用' + sh : '');
      } else {
        itEl.className = 'it';
        itEl.textContent = '';
      }
    }
    $('#sideMe .dot').className = 'dot ' + (me === 0 ? 'b' : 'w');
    $('#sideMe .nm').textContent = '你';
    paintSide('#sideMe', me);
    $('#sideOpp .dot').className = 'dot ' + (op === 0 ? 'b' : 'w');
    $('#sideOpp .nm').textContent = '敌';
    paintSide('#sideOpp', op);

    // ── 棋盘
    var anchors = v.need === 'second' ? (v.anchors || []) : [];
    var jt = (v.need === 'place' || v.need === 'second') ? (v.killTargets || []) : [];
    var shCells = [];
    if (v.shields) shCells = v.shields[0].concat(v.shields[1]);
    for (var i2 = 0; i2 < N * N; i2++) {
      var c = v.cells[i2], cls = 'cell';
      if (c === BLACK) cls += ' b'; else if (c === WHITE) cls += ' w'; else if (c === ASH) cls += ' a';
      if (anchors.indexOf(i2) >= 0) cls += ' anchor';
      if (jt.indexOf(i2) >= 0) cls += ' kill';
      if (shCells.indexOf(i2) >= 0) cls += ' sh';
      if (v.lastCell != null && v.lastCell === i2) cls += ' last';
      if (S.sel === i2) cls += ' sel';
      if (S.shieldPick) {
        if (c === me + 1) cls += ' tap';
      } else if (v.need === 'place') cls += ' tap';
      else if (v.need === 'second') {
        if (jt.indexOf(i2) >= 0) cls += ' tap';
        else if (c === EMPTY && (anchors.length === 0 || anchors.indexOf(i2) >= 0)) cls += ' tap';
      } else if (v.need === 'hidden' && c === EMPTY) cls += ' tap';
      cells[i2].className = cls;
    }

    // ── 消息 + 按钮
    var msg = '', btns = [];
    if (S.shieldPick) {
      msg = '<em>选盾位</em> —— 点一顆自己的子罩上盾。<br><s>盾挡一次杀，活过下一个明轮就没了。一个暗轮只能罩一块。</s>';
      btns.push({ t: '算了', ghost: true, f: function () { S.shieldPick = false; S.note = ''; render(); } });
      $('#msg').innerHTML = msg;
      var bxS = $('#btns'); bxS.innerHTML = '';
      btns.forEach(function (b3) {
        var el3 = document.createElement('button');
        el3.textContent = b3.t; el3.className = 'ghost'; el3.onclick = b3.f;
        bxS.appendChild(el3);
      });
      return;
    }
    if (!v.both) {
      msg = '把下面这个地址发给朋友，等他进桌 —— 或者再开一个浏览器标签页自己试。';
      btns.push({ t: '复制地址', ghost: true, f: copyLink });
    } else if (v.over) {
      var win = v.winner === me ? '你赢了' : v.winner === -1 ? '和棋' : '你输了';
      var mb = (v.blobs[me][0] || 0), ob = (v.blobs[op][0] || 0);
      msg = '<em>' + win + '</em>　最大块 ' + mb + ' : ' + ob + '　劫灰 ' + v.ashCount;
      btns.push({ t: '再来一局', wide: true, f: function () { act({ type: 'rematch' }); } });
      if (v.rematch[me]) msg += '<br>等对手确认，然后重新选弈士…';
    } else if (v.need === 'bid') {
      msg = '第 ' + v.round + ' 轮 —— 暗出几<em>气</em>抢先手？<br><s>抢到的气直接花掉，不给对手；出价低的可加价，也可放弃。都不加价，这轮就直接打暗轮（不进明轮，不发币）。</s>';
      var mx = v.qi[me] || 0;
      var cap = Math.min(mx, 8);
      for (var b = 0; b <= cap; b++) {
        btns.push({ t: b + ' 气', small: true, f: (function (n) { return function () { act({ type: 'bid', amount: n }); }; })(b) });
      }
      if (mx > cap) btns.push({ t: '全押 ' + mx, small: true, accent: true, f: function () { act({ type: 'bid', amount: mx }); } });
    } else if (v.need === 'tie') {
      msg = '双方都出了 <em>' + v.tieBid + '</em> 气。<br>再加就得高于它，不加就不用花 —— 两边都不加，这轮直接打暗轮。';
      btns.push({ t: '不加', wide: true, ghost: true, f: function () { act({ type: 'tie', amount: null }); } });
      for (var t1 = 1; t1 <= 3; t1++) {
        var amt = v.tieBid + t1;
        if (amt > (v.qi[me] || 0)) break;
        btns.push({ t: '加到 ' + amt, accent: true, f: (function (n) { return function () { act({ type: 'tie', amount: n }); }; })(amt) });
      }
    } else if (v.need === 'raise') {
      var hi = v.auctionHi, byMe = v.auctionHiBy === me;
      msg = (byMe ? '你' : '对手') + ' 现在出 <em>' + hi + '</em> 气。' +
        (byMe ? '<br>等对手决定加价还是放弃…' : '<br>你要加得比他高，或者放弃。');
      if (!byMe) {
        btns.push({ t: '放弃', wide: true, ghost: true, f: function () { act({ type: 'raise', amount: null }); } });
        for (var r1 = 1; r1 <= 3; r1++) {
          var a2 = hi + r1;
          if (a2 > (v.qi[me] || 0)) break;
          btns.push({ t: '加到 ' + a2, accent: true, f: (function (n) { return function () { act({ type: 'raise', amount: n }); }; })(a2) });
        }
      }
    } else if (v.need === 'order') {
      msg = '你以 <em>' + v.auctionHi + '</em> 气抢下了先手。选自己先动，还是后动？<br><s>先手这一子本轮不会被杀，而且动手越早，占位越自由。</s>';
      btns.push({ t: '我先动', wide: true, f: function () { act({ type: 'order', choice: 'first' }); } });
      btns.push({ t: '让对手先', wide: true, ghost: true, f: function () { act({ type: 'order', choice: 'second' }); } });
    } else if (v.need === 'place') {
      msg = '你先手 —— 任意空格落一子。<br><s>红圈里是可杀的棋子，点它就连子带格烧成劫灰（那一手不放子）。</s>';
    } else if (v.need === 'second') {
      msg = '任意空格落一子。<br><s>红圈里是可杀的棋子，点它就直接烧成劫灰。</s>';
    } else if (v.need === 'hidden') {
      if (S.sel != null) {
        msg = '就落在一闪一闪这格？确认后不能改。';
        btns.push({ t: '确认落子', wide: true, f: function () { act({ type: 'place', cell: S.sel }); } });
        btns.push({ t: '重选', ghost: true, f: function () { S.sel = null; render(); } });
      } else {
        msg = '暗轮 —— 悄悄选一格落子，对方看不到。<br>两人选中同一格，两手都作废，那格成灰 —— 这叫<em>劫</em>。<br><s>想护住哪颗子，就趁现在用盾（只能暗轮落子前用，一个暗轮一块）。</s>';
      }
      if ((v.items[me] || []).length) btns.push({ t: '用道具 (' + (v.items[me] || []).length + ')', ghost: true, f: openShop });
    } else {
      msg = (v.phase === 'auction' && v.myBid != null) ? '已出 <em>' + v.myBid + '</em> 币，等对手…'
        : v.phase === 'tie-raise' && v.tieMine !== null ? '已选，等对手…'
          : (v.phase === 'hidden' && v.myHidden != null) ? '你的子已经落下（<em>暗</em>），对手看不到。等对手落子…'
            : '等对手行动…';
    }
    if (S.note) msg += '<br><span style="color:#b4483a">' + S.note + '</span>';
    $('#msg').innerHTML = msg;

    var bx2 = $('#btns'); bx2.innerHTML = '';
    if (!v.over) {
      var sb = document.createElement('button');
      sb.className = 'shopbtn'; sb.textContent = '商店';
      sb.onclick = openShop;
      bx2.appendChild(sb);
    }
    btns.forEach(function (b) {
      var el = document.createElement('button');
      el.textContent = b.t;
      if (b.ghost) el.className = 'ghost';
      if (b.accent) el.className = 'accentbtn';
      if (b.small) el.className = (el.className ? el.className + ' ' : '') + 'small';
      if (b.wide) el.className = (el.className ? el.className + ' ' : '') + 'wide';
      el.onclick = b.f;
      bx2.appendChild(el);
    });

    // ── 底部
    var last = '';
    if (v.log && v.log.length) {
      var l = v.log[v.log.length - 1];
      if (l.t === 'kill') last = (l.p === me ? '你' : '对手') + ' 杀一颗子，成劫灰';
      else if (l.t === 'jie') last = '两人撞在同一格 —— 劫，成灰';
      else if (l.t === 'won') last = (l.p === me ? '你' : '对手') + ' 以 ' + l.price + ' 币抢下先手';
      else if (l.t === 'auction-none') last = '没人加价，这轮改走暗轮';
      else if (l.t === 'buy') last = (l.p === me ? '你' : '对手') + ' 买了一件东西';
      else if (l.t === 'order') last = (l.first === me ? '你' : '对手') + ' 先动';
    }
    $('#log').textContent = last;
    $('#room').innerHTML = '房号 <code>' + v.room + '</code>';

    renderShop();
    if (v.need !== 'hidden') S.sel = null;
  }

  function openShop() { S.shop = true; render(); }

  // ── 成灰特效：杀（红，主动，有冲击）／劫（蓝灰，无妄之灾）──
  function playFx(list) {
    var layer = $('#fx'), board = $('#board');
    if (!layer) return;
    var shake = false;
    list.forEach(function (e, k) {
      var kind = e.kind === 'jie' ? 'jie' : 'kill';
      if (kind === 'kill') shake = true;
      var col = e.cell % N, row = (e.cell / N) | 0;
      var d = document.createElement('div');
      d.className = 'fx ' + kind;
      d.style.left = ((col + .5) * 100 / N) + '%';
      d.style.top = ((row + .5) * 100 / N) + '%';
      d.style.animationDelay = (k * 90) + 'ms';
      var ink = document.createElement('div'); ink.className = 'ink';
      var w = document.createElement('div'); w.className = 'word';
      w.textContent = kind === 'jie' ? '劫' : '杀';
      d.appendChild(ink); d.appendChild(w);
      layer.appendChild(d);
      setTimeout(function () { d.remove(); }, 1500 + k * 90);
    });
    if (shake) {
      board.classList.remove('hit');
      void board.offsetWidth;
      board.classList.add('hit');
      setTimeout(function () { board.classList.remove('hit'); }, 400);
    }
  }

  function processFx(v) {
    if (!v || !v.fx || !v.fx.length) return;
    var last = v.fx[v.fx.length - 1].id;
    if (S.fxSeen < 0) { S.fxSeen = last; return; }   // 刚进桌/刷新，不补放旧特效
    if (last < S.fxSeen) { S.fxSeen = last; return; } // 换了一局（序号从 0 重数），不补放
    if (last === S.fxSeen) return;
    var fresh = v.fx.filter(function (e) { return e.id > S.fxSeen; });
    S.fxSeen = last;
    playFx(fresh);
  }

  function renderShop() {
    var box = $('#shop'), v = S.view;
    if (!S.shop || !v || v.picking) { box.className = ''; return; }
    box.className = 'on';
    var me = v.seat, list = v.shop || [], mine = v.items[me] || [];
    var host = $('#shopList'); host.innerHTML = '';
    list.forEach(function (it) {
      var owned = mine.filter(function (x) { return x === it.id; }).length;
      var row = document.createElement('div');
      row.className = 'item';
      row.innerHTML = '<div class="lf"><div class="nm">' + it.name + '</div>' +
        '<div class="ds">' + it.desc + '</div></div>' +
        '<div class="ct">' + it.price + ' 币<br>' + (owned ? '有 ' + owned + ' 件' : '') + '</div>';
      var buy = document.createElement('button');
      buy.textContent = '买';
      buy.disabled = (v.coins[me] || 0) < it.price || v.over;
      buy.onclick = function () { act({ type: 'buy', id: it.id }); };
      row.appendChild(buy);
      if (owned > 0 && v.need === 'hidden' && it.when === 'hidden') {
        var use = document.createElement('button');
        use.className = 'ghost'; use.textContent = '用';
        use.onclick = function () {
          if (it.id === 'shield') {
            // 盾要点自己的一颗子：关掉商店，进入「点格子挑盾位」模式
            S.shop = false; S.shieldPick = true; S.note = '点一颗自己的子，把盾罩在它上面（暗轮落子前才能用）';
            render();
            return;
          }
          act({ type: 'use', id: it.id });
        };
        row.appendChild(use);
      }
      host.appendChild(row);
    });
    $('#shopClose').onclick = function () { S.shop = false; render(); };
  }

  function copyLink() {
    var url = location.origin + '/#' + S.room;
    var done = function () { $('#msg').innerHTML = '链接已复制：<br><code>' + url + '</code>'; };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(done, function () { prompt('复制这个地址', url); });
    } else prompt('复制这个地址', url);
  }

  var hash = (location.hash || '').replace('#', '').trim().toUpperCase();
  var saved = sessionStorage.getItem('jh_room');
  join(hash || saved || '');
})();
</script>
</body>
</html>
